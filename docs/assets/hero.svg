<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 264" width="900" height="264" role="img" aria-labelledby="qp-hero-t qp-hero-d">
<title id="qp-hero-t">Query Pilot</title>
<desc id="qp-hero-d">Schema-aware SQL generation, execution, and self-healing debugging powered by FastAPI, React, and Ollama.</desc>
<defs>
<linearGradient id="qp-hero-ttl" x1="0" x2="1"><stop class="g1" offset="0"/><stop class="g2" offset=".55"/><stop class="g3" offset="1"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.fg{fill:#E6EDF3} .mut{fill:#8B949E} .dim{fill:#7D8590}
.sky{fill:#38BDF8} .sky-s{stroke:#38BDF8}
.amb{fill:#FBBF24} .amb-s{stroke:#FBBF24}
.bd{fill:none;stroke:#E6EDF3;stroke-opacity:.2;stroke-width:1.2}
.g1{stop-color:#E6EDF3} .g2{stop-color:#38BDF8} .g3{stop-color:#FBBF24}

.qp-ring{fill:none;stroke:#38BDF8;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:qp-radar 2.4s ease-out infinite}
.qp-dot{fill:#38BDF8;animation:qp-dotb 2.4s ease-in-out infinite}
@keyframes qp-radar{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.8);opacity:0}}
@keyframes qp-dotb{0%,100%{opacity:1}50%{opacity:.4}}

.qp-tag-1{opacity:1;animation:qp-cyc-1 9s ease-in-out infinite}
.qp-tag-2{opacity:0;animation:qp-cyc-2 9s ease-in-out infinite}
.qp-tag-3{opacity:0;animation:qp-cyc-3 9s ease-in-out infinite}
@keyframes qp-cyc-1{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes qp-cyc-2{0%,30%{opacity:0}35%,61%{opacity:1}66%,100%{opacity:0}}
@keyframes qp-cyc-3{0%,63%{opacity:0}68%,94%{opacity:1}99%,100%{opacity:0}}

.qp-cur{animation:qp-blink 1.1s steps(2,start) infinite}
@keyframes qp-blink{to{opacity:0}}

.qp-term{animation:qp-tb 4.5s ease-in-out infinite}
@keyframes qp-tb{0%,100%{stroke-opacity:.2;stroke:#E6EDF3}50%{stroke-opacity:.65;stroke:#38BDF8}}

.qp-pill-1{animation:qp-pw 6s ease-in-out infinite 0s}
.qp-pill-2{animation:qp-pw 6s ease-in-out infinite 1.5s}
.qp-pill-3{animation:qp-pw 6s ease-in-out infinite 3.0s}
.qp-pill-4{animation:qp-pw 6s ease-in-out infinite 4.5s}
.qp-ptxt-1{animation:qp-pt 6s ease-in-out infinite 0s}
.qp-ptxt-2{animation:qp-pt 6s ease-in-out infinite 1.5s}
.qp-ptxt-3{animation:qp-pt 6s ease-in-out infinite 3.0s}
.qp-ptxt-4{animation:qp-pt 6s ease-in-out infinite 4.5s}
@keyframes qp-pw{0%,100%{stroke-opacity:.2;stroke:#E6EDF3}12%,25%{stroke-opacity:1;stroke:#38BDF8}}
@keyframes qp-pt{0%,100%{fill:#8B949E}12%,25%{fill:#38BDF8}}

@media (prefers-color-scheme:light){
 .fg{fill:#24292F} .mut{fill:#57606A} .dim{fill:#6E7781}
 .sky{fill:#0284C7} .sky-s{stroke:#0284C7}
 .amb{fill:#D97706} .amb-s{stroke:#D97706}
 .bd{stroke:#24292F;stroke-opacity:.2}
 .g1{stop-color:#24292F} .g2{stop-color:#0284C7} .g3{stop-color:#D97706}
 .qp-ring{stroke:#0284C7} .qp-dot{fill:#0284C7}
 @keyframes qp-tb{0%,100%{stroke-opacity:.2;stroke:#24292F}50%{stroke-opacity:.65;stroke:#0284C7}}
 @keyframes qp-pw{0%,100%{stroke-opacity:.2;stroke:#24292F}12%,25%{stroke-opacity:1;stroke:#0284C7}}
 @keyframes qp-pt{0%,100%{fill:#57606A}12%,25%{fill:#0284C7}}
}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
 .motion-only{display:none}
}
</style>

<circle cx="332" cy="24" r="4.5" class="qp-ring motion-only"/>
<circle cx="332" cy="24" r="4.5" class="qp-dot"/>
<text x="346" y="28.5" font-size="12.5" font-weight="600" letter-spacing="1.4" class="m sky">LOCAL LLM  |  SQL &amp; NOSQL</text>

<text x="450" y="86" text-anchor="middle" font-size="54" font-weight="750" letter-spacing="-1.6" fill="url(#qp-hero-ttl)">Query Pilot</text>

<text x="450" y="122" text-anchor="middle" font-size="18.5" class="mut qp-tag-1">Schema-aware SQL generation, execution, and self-healing debugging</text>
<text x="450" y="122" text-anchor="middle" font-size="18.5" class="mut qp-tag-2">Natural language to JOINs across MySQL, PostgreSQL, SQLite, and MongoDB</text>
<text x="450" y="122" text-anchor="middle" font-size="18.5" class="mut qp-tag-3">Side-by-side AI SQL diff view with automatic fix-and-retry loop</text>

<rect x="165" y="144" width="570" height="40" rx="6" class="bd qp-term"/>
<text x="186" y="169" font-size="13.5" class="m amb">&gt;_</text>
<text x="212" y="169" font-size="13.5" class="m fg">SELECT c.id, SUM(o.total) FROM customers c JOIN orders o ...;</text>
<rect x="708" y="155" width="8" height="17" rx="1" class="sky qp-cur"/>

<rect x="172" y="206" width="108" height="32" rx="6" class="bd qp-pill-1"/>
<text x="226" y="227" text-anchor="middle" font-size="13" font-weight="500" class="mut m qp-ptxt-1">FastAPI</text>
<rect x="294" y="206" width="132" height="32" rx="6" class="bd qp-pill-2"/>
<text x="360" y="227" text-anchor="middle" font-size="13" font-weight="500" class="mut m qp-ptxt-2">React + Vite</text>
<rect x="440" y="206" width="164" height="32" rx="6" class="bd qp-pill-3"/>
<text x="522" y="227" text-anchor="middle" font-size="13" font-weight="500" class="mut m qp-ptxt-3">Ollama / Llama 3.2</text>
<rect x="618" y="206" width="114" height="32" rx="6" class="bd qp-pill-4"/>
<text x="675" y="227" text-anchor="middle" font-size="13" font-weight="500" class="mut m qp-ptxt-4">MIT License</text>
</svg>
