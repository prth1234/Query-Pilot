<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img">
<defs>
<linearGradient id="qp-hero-ttl" x1="0" x2="1"><stop class="g1" offset="0"/><stop class="g2" offset=".55"/><stop class="g3" offset="1"/></linearGradient>
</defs>
<style>

text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.fg{fill:#E6EDF3} .mut{fill:#8B949E} .dim{fill:#7D8590}
.sky{fill:#38BDF8} .sky-s{stroke:#38BDF8}
.amb{fill:#FBBF24} .amb-s{stroke:#FBBF24}
.bd{fill:none;stroke:#E6EDF3;stroke-opacity:.2;stroke-width:1.2}
.ln{stroke:#E6EDF3;stroke-opacity:.15;stroke-width:1.2}
.g1{stop-color:#E6EDF3} .g2{stop-color:#38BDF8} .g3{stop-color:#FBBF24}
@media (prefers-color-scheme:light){
 .fg{fill:#24292F} .mut{fill:#57606A} .dim{fill:#6E7781}
 .sky{fill:#0284C7} .sky-s{stroke:#0284C7}
 .amb{fill:#D97706} .amb-s{stroke:#D97706}
 .bd{stroke:#24292F;stroke-opacity:.2} .ln{stroke:#24292F;stroke-opacity:.16}
 .g1{stop-color:#24292F} .g2{stop-color:#0284C7} .g3{stop-color:#D97706}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.qp-cur{animation:qp-blink 1.2s steps(2,start) infinite}
@keyframes qp-blink{to{opacity:0}}

</style>

<text x="450" y="82" text-anchor="middle" font-size="54" font-weight="750" letter-spacing="-1.6" fill="url(#qp-hero-ttl)">Query Pilot</text>
<text x="450" y="120" text-anchor="middle" font-size="19" class="mut">Schema-aware SQL generation, execution, and self-healing debugging</text>
<rect x="165" y="142" width="570" height="40" rx="6" class="bd"/>
<text x="186" y="167" font-size="13.5" class="m amb">&gt;_</text>
<text x="212" y="167" font-size="13.5" class="m fg">SELECT c.id, SUM(o.total) FROM customers c JOIN orders o ...;</text>
<rect x="708" y="153" width="8" height="17" rx="1" class="sky qp-cur"/>
<rect x="172" y="204" width="108" height="32" rx="6" class="bd"/>
<text x="226" y="225" text-anchor="middle" font-size="13" font-weight="500" class="mut m">FastAPI</text>
<rect x="294" y="204" width="132" height="32" rx="6" class="bd"/>
<text x="360" y="225" text-anchor="middle" font-size="13" font-weight="500" class="mut m">React + Vite</text>
<rect x="440" y="204" width="164" height="32" rx="6" class="bd"/>
<text x="522" y="225" text-anchor="middle" font-size="13" font-weight="500" class="mut m">Ollama / Llama 3.2</text>
<rect x="618" y="204" width="114" height="32" rx="6" class="bd"/>
<text x="675" y="225" text-anchor="middle" font-size="13" font-weight="500" class="mut m">MIT License</text>

</svg>
