<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-labelledby="qp-foot-t qp-foot-d">
<title id="qp-foot-t">Query Pilot Footer</title>
<desc id="qp-foot-d">Natural language to verified SQL, locally.</desc>
<defs>
<path id="qp-foot-track" d="M 120 14 L 780 14" fill="none"/>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.fg{fill:#E6EDF3} .sky{fill:#38BDF8} .amb{fill:#FBBF24}
.ln{stroke:#E6EDF3;stroke-opacity:.15;stroke-width:1.2}
.qp-cur{animation:qp-fb 1.1s steps(2,start) infinite}
@keyframes qp-fb{to{opacity:0}}
@media (prefers-color-scheme:light){
 .fg{fill:#24292F} .sky{fill:#0284C7} .amb{fill:#D97706}
 .ln{stroke:#24292F;stroke-opacity:.16}
}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .motion-only{display:none}
}
</style>

<line x1="120" y1="14" x2="780" y2="14" class="ln"/>
<circle r="3" class="amb motion-only">
  <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#qp-foot-track"/></animateMotion>
</circle>
<text x="450" y="50" text-anchor="middle" font-size="22" font-weight="650" class="fg">Natural language to verified SQL, locally.</text>
<text x="442" y="76" text-anchor="middle" font-size="13.5" class="m amb">./setup.sh &amp;&amp; ./start.sh</text>
<rect x="556" y="64" width="7" height="15" rx="1" class="sky qp-cur"/>
</svg>
