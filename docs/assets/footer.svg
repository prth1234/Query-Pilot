<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img">
<defs>

</defs>
<style>

text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.fg{fill:#E6EDF3} .mut{fill:#8B949E} .dim{fill:#7D8590}
.sky{fill:#38BDF8} .sky-s{stroke:#38BDF8}
.amb{fill:#FBBF24} .amb-s{stroke:#FBBF24}
.bd{fill:none;stroke:#E6EDF3;stroke-opacity:.2;stroke-width:1.2}
.ln{stroke:#E6EDF3;stroke-opacity:.15;stroke-width:1.2}
.g1{stop-color:#E6EDF3} .g2{stop-color:#38BDF8} .g3{stop-color:#FBBF24}
@media (prefers-color-scheme:light){
 .fg{fill:#24292F} .mut{fill:#57606A} .dim{fill:#6E7781}
 .sky{fill:#0284C7} .sky-s{stroke:#0284C7}
 .amb{fill:#D97706} .amb-s{stroke:#D97706}
 .bd{stroke:#24292F;stroke-opacity:.2} .ln{stroke:#24292F;stroke-opacity:.16}
 .g1{stop-color:#24292F} .g2{stop-color:#0284C7} .g3{stop-color:#D97706}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>

<line x1="120" y1="14" x2="780" y2="14" class="ln"/>
<text x="450" y="50" text-anchor="middle" font-size="22" font-weight="650" class="fg">Natural language to verified SQL, locally.</text>
<text x="450" y="76" text-anchor="middle" font-size="13.5" class="m amb">./setup.sh &amp;&amp; ./start.sh</text>

</svg>
