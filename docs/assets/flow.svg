<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img">
<defs>
<marker id="qp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9z" class="sky"/></marker>
</defs>
<style>

text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.fg{fill:#E6EDF3} .mut{fill:#8B949E} .dim{fill:#7D8590}
.sky{fill:#38BDF8} .sky-s{stroke:#38BDF8}
.amb{fill:#FBBF24} .amb-s{stroke:#FBBF24}
.bd{fill:none;stroke:#E6EDF3;stroke-opacity:.2;stroke-width:1.2}
.ln{stroke:#E6EDF3;stroke-opacity:.15;stroke-width:1.2}
.g1{stop-color:#E6EDF3} .g2{stop-color:#38BDF8} .g3{stop-color:#FBBF24}
@media (prefers-color-scheme:light){
 .fg{fill:#24292F} .mut{fill:#57606A} .dim{fill:#6E7781}
 .sky{fill:#0284C7} .sky-s{stroke:#0284C7}
 .amb{fill:#D97706} .amb-s{stroke:#D97706}
 .bd{stroke:#24292F;stroke-opacity:.2} .ln{stroke:#24292F;stroke-opacity:.16}
 .g1{stop-color:#24292F} .g2{stop-color:#0284C7} .g3{stop-color:#D97706}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.qp-fl{stroke-dasharray:5 5;animation:qp-f 1.3s linear infinite}
@keyframes qp-f{to{stroke-dashoffset:-10}}

</style>

<rect x="10" y="32" width="150" height="86" rx="6" class="bd"/>
<text x="85" y="64" text-anchor="middle" font-size="16" font-weight="650" class="fg">React UI</text>
<text x="85" y="86" text-anchor="middle" font-size="12.5" class="mut m">db-llm/</text>
<text x="85" y="104" text-anchor="middle" font-size="12.5" class="dim">Editor &amp; Diff</text>

<line x1="160" y1="75" x2="190" y2="75" class="sky-s qp-fl" stroke-width="1.8" marker-end="url(#qp-arr)"/>

<rect x="194" y="32" width="150" height="86" rx="6" class="bd"/>
<text x="269" y="64" text-anchor="middle" font-size="16" font-weight="650" class="fg">FastAPI</text>
<text x="269" y="86" text-anchor="middle" font-size="12.5" class="mut m">backend/</text>
<text x="269" y="104" text-anchor="middle" font-size="12.5" class="dim">Async &amp; Cache</text>

<line x1="344" y1="75" x2="374" y2="75" class="sky-s qp-fl" stroke-width="1.8" marker-end="url(#qp-arr)"/>

<rect x="378" y="32" width="150" height="86" rx="6" class="bd"/>
<text x="453" y="64" text-anchor="middle" font-size="16" font-weight="650" class="fg">Local LLM</text>
<text x="453" y="86" text-anchor="middle" font-size="12.5" class="mut m">Ollama</text>
<text x="453" y="104" text-anchor="middle" font-size="12.5" class="dim">Llama 3.2 SQL</text>

<line x1="528" y1="75" x2="558" y2="75" class="sky-s qp-fl" stroke-width="1.8" marker-end="url(#qp-arr)"/>

<rect x="562" y="32" width="150" height="86" rx="6" class="bd"/>
<text x="637" y="64" text-anchor="middle" font-size="16" font-weight="650" class="fg">DB Pool</text>
<text x="637" y="86" text-anchor="middle" font-size="12.5" class="mut m">Multi-DB</text>
<text x="637" y="104" text-anchor="middle" font-size="12.5" class="dim">MySQL/PG/Mongo</text>

<line x1="712" y1="75" x2="742" y2="75" class="sky-s qp-fl" stroke-width="1.8" marker-end="url(#qp-arr)"/>

<rect x="746" y="32" width="144" height="86" rx="6" class="bd"/>
<text x="818" y="64" text-anchor="middle" font-size="16" font-weight="650" class="fg">Results</text>
<text x="818" y="86" text-anchor="middle" font-size="12.5" class="mut">Table &amp; Fix</text>
<text x="818" y="104" text-anchor="middle" font-size="12.5" class="dim">Auto-debug</text>

</svg>
